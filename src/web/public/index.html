<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ihr-mcp 考勤管理</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #333; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #e5e5e5; padding: 6px 10px; font-size: 13px; text-align: left; }
  th { background: #fafafa; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .manual { background: #e6f7e6; color: #389e0d; }
  .guess { background: #fff7e6; color: #d48806; }
  .none { background: #fff1f0; color: #cf1322; }
  button { padding: 4px 14px; cursor: pointer; }
  #msg { margin-left: 12px; font-size: 13px; color: #888; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  #cfgPanel input { padding: 3px 6px; }
</style>
</head>
<body>
<div class="header">
  <h1>ihr-mcp 考勤管理</h1>
  <button onclick="openConfig()">⚙ 配置</button>
</div>
<div class="card" id="status">状态加载中…</div>
<div class="card" id="cfgPanel" style="display:none">
  <h1 style="font-size:16px;margin-top:0">服务配置（保存并重启后生效）</h1>
  <table style="margin-bottom:10px">
    <tr><th style="width:120px">用户名</th><td><input id="cfgUser" style="width:100%"></td></tr>
    <tr><th>密码</th><td><input id="cfgPwd" type="password" placeholder="留空则保持现有密码" style="width:100%"></td></tr>
    <tr><th>项目根目录</th><td><input id="cfgRoot" style="width:100%" placeholder="如 F:\项目"></td></tr>
    <tr><th>监听地址 IP</th><td><input id="cfgHost" style="width:100%" placeholder="127.0.0.1"></td></tr>
    <tr><th>端口</th><td><input id="cfgPort" style="width:100%" placeholder="13210"></td></tr>
  </table>
  <button onclick="saveConfig()">保存并重启生效</button>
  <button onclick="document.getElementById('cfgPanel').style.display='none'">取消</button>
  <span id="cfgMsg" style="margin-left:12px;font-size:13px;color:#888"></span>
</div>
<div class="card">
  <button onclick="loadProjects()">刷新项目列表</button><span id="msg"></span>
  <table id="projTable" style="margin-top:12px">
    <thead><tr><th>项目编号</th><th>项目名称</th><th>活动类型</th><th>客户</th><th>来源</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const SOURCE_LABEL = { manual: '手动', guess: '推断', none: '未匹配' };

async function loadStatus() {
  const el = document.getElementById('status');
  try {
    const s = await (await fetch('/api/status')).json();
    if (!s.configOk) {
      el.innerHTML = '⚠️ 凭据未配置：请在程序根目录 <code>config.json</code>（与 service-install.cmd 同级）填入 username/password 后重启服务';
    } else {
      const exp = s.loggedIn ? '✅ 有效至 ' + new Date(s.tokenExpiresAt).toLocaleString() : '⏳ 未登录（首次调用时自动登录）';
      el.innerHTML = '用户：<b>' + esc(s.username) + '</b> ｜ 登录态：' + exp;
    }
  } catch (e) {
    el.textContent = '状态获取失败: ' + e.message;
  }
}

async function loadProjects() {
  const msg = document.getElementById('msg');
  msg.textContent = '加载中…';
  try {
    const [projRes, folderRes] = await Promise.all([fetch('/api/projects'), fetch('/api/local-folders')]);
    const { projects } = await projRes.json();
    if (!Array.isArray(projects) || projects.length === 0) {
      msg.textContent = '未获取到项目条目（检查登录状态与凭据）';
      return;
    }
    const { folders } = await folderRes.json();
    const tbody = document.querySelector('#projTable tbody');
    tbody.innerHTML = '';
    for (const p of projects) {
      const options = [...new Set([p.customer, ...folders])]
        .map((f) => '<option value="' + esc(f) + '"' + (f === p.customer ? ' selected' : '') + '>' + esc(f) + '</option>')
        .join('');
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + esc(p.projectCode) + '</td><td>' + esc(p.projectName) + '</td><td>' + esc(p.activityType || '-') + '</td>'
        + '<td><select data-code="' + esc(p.projectCode) + '">' + options + '</select></td>'
        + '<td><span class="tag ' + p.customerSource + '">' + (SOURCE_LABEL[p.customerSource] || p.customerSource) + '</span></td>';
      tr.querySelector('select').addEventListener('change', (e) => {
        saveMapping(e.target.dataset.code, e.target.value);
      });
      tbody.appendChild(tr);
    }
    msg.textContent = '共 ' + projects.length + ' 个条目';
  } catch (e) {
    msg.textContent = '加载失败: ' + e.message;
  }
}

async function saveMapping(code, customer) {
  const r = await (await fetch('/api/mapping', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ projectCode: code, customer }),
  })).json();
  document.getElementById('msg').textContent = r.ok ? '已保存 ' + code + ' → ' + customer : '保存失败: ' + (r.error || '');
}

async function openConfig() {
  try {
    const c = await (await fetch('/api/config')).json();
    document.getElementById('cfgUser').value = c.username || '';
    document.getElementById('cfgPwd').value = '';
    document.getElementById('cfgRoot').value = c.projectsRoot || '';
    document.getElementById('cfgHost').value = c.host || '';
    document.getElementById('cfgPort').value = c.port || '';
    document.getElementById('cfgMsg').textContent = '';
    document.getElementById('cfgPanel').style.display = 'block';
  } catch (e) {
    document.getElementById('cfgMsg').textContent = '配置读取失败: ' + e.message;
  }
}

async function saveConfig() {
  const msg = document.getElementById('cfgMsg');
  const body = {
    username: document.getElementById('cfgUser').value.trim(),
    password: document.getElementById('cfgPwd').value,
    projectsRoot: document.getElementById('cfgRoot').value.trim(),
    host: document.getElementById('cfgHost').value.trim(),
    port: document.getElementById('cfgPort').value.trim(),
  };
  if (!body.password) delete body.password; // 留空 = 保持现有密码
  const r1 = await (await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })).json();
  if (!r1.ok) { msg.textContent = '保存失败: ' + (r1.error || ''); return; }
  msg.textContent = '已保存，服务重启中，几秒后自动刷新…';
  try { await fetch('/api/restart', { method: 'POST' }); } catch (e) { /* 重启导致断开属预期 */ }
  // 新监听地址：host 填 0.0.0.0 时按当前页面的主机名访问
  const newHost = (body.host === '0.0.0.0' || body.host === '::') ? location.hostname : body.host;
  const pollURL = 'http://' + newHost + ':' + (body.port || location.port) + '/api/status';
  let n = 0;
  const timer = setInterval(async () => {
    n++;
    try {
      await fetch(pollURL);
      clearInterval(timer);
      location.href = pollURL.replace('/api/status', '/');
    } catch (e) {
      if (n > 15) { clearInterval(timer); msg.textContent = '重启超时，请检查服务后手动刷新'; }
    }
  }, 1000);
}

loadStatus();
loadProjects();
</script>
</body>
</html>
